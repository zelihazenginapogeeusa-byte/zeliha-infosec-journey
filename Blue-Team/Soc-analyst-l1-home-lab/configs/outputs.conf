# Sample outputs.conf — Splunk Universal Forwarder (on the Windows 10 endpoint)
# File location: %SPLUNK_HOME%\etc\system\local\outputs.conf
#
# Replace <SPLUNK_SERVER_IP> with the internal-network IP address of the
# Splunk Enterprise server running on Ubuntu. Default receiving port is 9997.

[tcpout]
defaultGroup = splunk_server

[tcpout:splunk_server]
server = <SPLUNK_SERVER_IP>:9997
sslVerifyServerCert = false
compressed = true

[tcpout-server://<SPLUNK_SERVER_IP>:9997]
