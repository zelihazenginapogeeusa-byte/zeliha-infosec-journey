# Sample inputs.conf — Splunk Universal Forwarder (on the Windows 10 endpoint)
# File location: %SPLUNK_HOME%\etc\system\local\inputs.conf
#
# This file defines which logs get sent to Splunk.
# Adjust the index names and log sources to fit your environment.

[WinEventLog://Security]
disabled = 0
index = windows

[WinEventLog://System]
disabled = 0
index = windows

[WinEventLog://Application]
disabled = 0
index = windows

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = 1
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
